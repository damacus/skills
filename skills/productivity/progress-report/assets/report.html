<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>$page_title</title>
  <style>$styles</style>
</head>
<body>
  <a class="skip" href="#report">Skip to the report</a>
  <div class="layout">
    <nav class="navigation" aria-label="Report sections">
      <strong>$project</strong><p>$report_name</p>
      <details class="navigation-menu" open>
        <summary>Report navigation</summary>
        <div class="links">$navigation</div>
      </details>
    </nav>
    <main id="report">
      <header class="hero">
        <div class="eyebrow">$report_name</div>
        <h1>$headline</h1>
        $overview
        <p class="stamp">Evidence snapshot: $updated · <a href="$data_source">JSON data</a></p>
      </header>
      $content
      <footer class="footer"><p>Complete = implemented, published and checks passed. Counts do not measure effort or release readiness.</p></footer>
    </main>
  </div>
  <script>
    const navigation = document.querySelector('.navigation-menu');
    const narrow = matchMedia('(max-width: 760px)');
    function adaptNavigation() { navigation.open = !narrow.matches; }
    narrow.addEventListener('change', adaptNavigation);
    adaptNavigation();
    function revealTarget() {
      let id;
      try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
      const target = document.getElementById(id);
      if (target) {
        let parent = target.parentElement;
        while (parent) { if (parent.tagName === 'DETAILS') parent.open = true; parent = parent.parentElement; }
        target.scrollIntoView();
      }
      document.querySelectorAll('.navigation a').forEach(link => {
        if (link.hash === location.hash || (!location.hash && link.hash === '#report')) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    }
    addEventListener('hashchange', revealTarget);
    revealTarget();
    let previouslyOpen = [];
    addEventListener('beforeprint', () => {
      previouslyOpen = [...document.querySelectorAll('details')].map(item => item.open);
      document.querySelectorAll('details').forEach(item => { item.open = true; });
    });
    addEventListener('afterprint', () => {
      document.querySelectorAll('details').forEach((item, index) => { item.open = previouslyOpen[index]; });
    });
  </script>
</body>
</html>
